<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/styles.css">

    <title>Todo list</title>
</head>
<body>
    <main class="main_wrapper">
        <div class="todo_list_wrapper">
            <header class="todo_list_header">
                <h2 class="header_title">// TERMINAL_TODO_LIST_V0.1 //</h2>
            </header>
            <div class="todo_list_display">
                <div class="user_input_wrapper">
                    <form action="">
                        <label class="terminal_prefix">guest@system_root:~$ </label>
                        
                        <input type="text" name="" id="" class="user_input" placeholder="[SYSTEM_AWAITING_INPUT]...">
                    </form>
                </div>

                <ul class="todo_list_cards">
                    <li class="todo_list_card">
                        <div class="indicator"></div>
                        <div class="user_text_wrapper">
                            <span class="user_text">Wipe index.html data cache</span>
                        </div>
                    </li>
                </ul>

                
            </div>
        </div>
    </main>
</body>
</html>
