<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/reset.css">
        <link rel="stylesheet" href="./styles/styles.css">
        <script src="./js/index.js" defer></script>
        <title>theme toggler</title>
    </head>
    <body>
        <main class="main_wrapper">
            <label class="theme_toggle">
                <input type="checkbox" id="theme_checkbox">

                <span class="clouds_layer">
                    <span class="cloud_main">
                        <span class="cloud_part"></span>
                        <span class="cloud_part"></span>
                        <span class="cloud_part"></span>
                    </span>
                    
                    
                    <span class="cloud_secondary">
                        <span class="cloud_part"></span>
                        <span class="cloud_part"></span>
                        <span class="cloud_part"></span>
                    </span>
                </span>
                <span class="stars_layer">
                    <span class="star_part"></span>
                    <span class="star_part"></span>
                    <span class="star_part"></span>
                    <span class="star_part"></span>
                    <span class="star_part"></span>
                </span>
                <span class="toggle_button"></span>
            </label>
        </main>
    </body>
</html>
