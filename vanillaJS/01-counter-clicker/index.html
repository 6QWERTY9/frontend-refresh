<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="shortcut icon" href="./assets/icons/Kursor-rukasvg-3.svg" type="image/x-icon">
    <title>Count clicker</title>
</head>
<body>
    <div class="container">
        <header class="header_container">
            <div class="header-wrapper content">
                <div class="icon_wrapper">
                    <a href="#" class="icon"></a>
                </div>
            </div>
        </header>
        <main class="main_container">
            <div class="main-wrapper content">
                <div class="counter_clicker_wrapper">
                    <div class="counter_clicker">
                        <div class="count">0</div>
                        <button type="button" class="button added">+1</button>
                        <button type="button" class="button reset">reset</button>
                        
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer_container">
            <div class="footer-wrapper content">
                <div class="icon_wrapper">
                    <a href="#" class="icon"></a>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
