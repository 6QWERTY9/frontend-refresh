<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="shortcut icon" href="./assets/icons/Kursor-rukasvg-3.svg" type="image/x-icon">
    <title>Count clicker</title>
</head>
<body>
    <div class="container">
        <header class="header_container">
            <div class="header_wrapper content">
                <div class="icon_wrapper">
                    <a href="#" class="icon">
                        <img src="./assets/icons/Kursor-rukasvg-3.svg" alt="">
                    </a>
                </div>
            </div>
        </header>

        <main class="main_container">
            <div class="main_wrapper content">
                <div class="counter_clicker_wrapper">
                    <div class="technical-scale">
                        <div class="scale-line"></div>
                            <span class="scale-text">LOGIC UNIT // MODE 01</span>
                        <div class="scale-line"></div>
                    </div>

                    <div class="power-led"></div>

                    <div class="display">0</div>
                    
                    <button type="button" class="button increment">+ 1</button>
                    <button type="button" class="button decrement">- 1</button>
                    <button type="button" class="button reset">reset</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
